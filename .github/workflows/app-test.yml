name: app-test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test
